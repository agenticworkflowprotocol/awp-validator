# Conformance case 5.6.5-for-each-on-approval-step
# Spec section 5.6.1: forEach is not allowed on approval steps.
# Expected: invalid (schema.not at /spec/workflow/1)
apiVersion: awp.agenticworkflowprotocol.org/v1alpha3
kind: Workflow
metadata:
  name: conformance-base
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  inputs:
    - name: repo
      type: string
      required: true
    - name: images
      type: array
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 2
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: list
      agent: worker
      task: List the files of ${{ inputs.repo }}.
      outputs:
        - name: files
    - id: release
      type: approval
      dependsOn:
        - list
      approval:
        approvers:
          - role: release-manager
      forEach:
        items: ${{ steps.list.outputs.files }}
        maxItems: 20
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
