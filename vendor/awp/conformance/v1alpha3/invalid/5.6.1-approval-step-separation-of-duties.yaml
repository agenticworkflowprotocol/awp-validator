# Conformance case 5.6.1-approval-step-separation-of-duties
# Spec section 5.6.1: An approval step has no separationOfDuties; it applies only at workflow level.
# Expected: invalid (schema.additionalProperties at /spec/workflow/2/approval/separationOfDuties)
apiVersion: awp.agenticworkflowprotocol.org/v1alpha3
kind: Workflow
metadata:
  name: conformance-base
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
    - id: apply
      agent: worker
      task: Apply ${{ steps.analyze.outputs.report }}.
      dependsOn:
        - analyze
    - id: gate
      type: approval
      dependsOn:
        - apply
      approval:
        approvers:
          - role: release-manager
        separationOfDuties:
          enabled: true
          rules:
            - initiatorCannotApprove: true
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
