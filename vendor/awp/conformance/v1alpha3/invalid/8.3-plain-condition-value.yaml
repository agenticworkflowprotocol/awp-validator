# Conformance case 8.3-plain-condition-value
# Spec section 8.3: Each condition attribute maps to an operator object; the plain-value shorthand of v1alpha1 is removed.
# Expected: invalid (schema.type at /spec/rules/0/when/action)
# Profiles supported by the validator for this case: core
apiVersion: awp.agenticworkflowprotocol.org/v1alpha3
kind: Policy
metadata:
  name: conformance-policy
spec:
  version: 1.0.0
  owner:
    team: governance-team
  rules:
    - id: deploy-needs-approval
      when:
        action: production.deploy
      effect: requireApproval
      approval:
        approvers:
          - role: release-manager
    - id: pd-stays-in-eu
      when:
        data.classification:
          in:
            - personal
            - sensitive
        destination.region:
          notIn:
            - EU
      effect: deny
      message: Personal data must stay in the EU.
