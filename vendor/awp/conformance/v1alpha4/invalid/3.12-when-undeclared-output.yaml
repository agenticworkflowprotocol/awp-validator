# Conformance case 3.12-when-undeclared-output
# Spec section 3.12: <name> in steps.<id>.outputs.<name> MUST be a declared output of <id>.
# Expected: invalid (when.undeclared-output at /spec/workflow/1/when)
apiVersion: awp.agenticworkflowprotocol.org/v1alpha4
kind: Workflow
metadata:
  name: conformance-base
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
    - id: apply
      agent: worker
      dependsOn:
        - analyze
      when: 'steps.analyze.outputs.severity == "high"'
      task: Apply the report.
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
