# Conformance case 5.8-agent-manifest-human-input
# Spec section 5.8: humanInput is also allowed in an Agent manifest.
# Expected: valid
apiVersion: awp.agenticworkflowprotocol.org/v1alpha4
kind: Agent
metadata:
  name: conformance-agent
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  model:
    provider: ollama
    name: qwen3
  instructions: Extract fields.
  permissions:
    default: deny
  mcpServers:
    - name: docs
      transport: stdio
      image: registry.example.com/mcp/docs@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  tools:
    - type: mcp
      server: docs
      tools:
        - read
    - type: builtin
      name: shell
  budget:
    maxSteps: 5
  secrets:
    - name: DOCS_KEY
      source: vault
      scope:
        - docs
  humanInput:
    answerers:
      - user: alice@example.com
