# Conformance case 5.6.1-when-json-path-into-output
# Spec section 3.12: Path segments after the output name select into the output parsed as JSON; a transitive dependency may be read.
# Expected: valid
apiVersion: awp.agenticworkflowprotocol.org/v1alpha4
kind: Workflow
metadata:
  name: conformance-base
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
        - name: level
    - id: plan
      agent: worker
      dependsOn:
        - analyze
      task: Plan ${{ steps.analyze.outputs.report }}.
    - id: apply
      agent: worker
      dependsOn:
        - plan
      when: steps.analyze.outputs.report.findings[0].severity >= 7 && steps.analyze.outputs.report.affected == true
      task: Apply the plan.
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
