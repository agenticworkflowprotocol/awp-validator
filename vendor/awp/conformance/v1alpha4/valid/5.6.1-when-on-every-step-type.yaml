# Conformance case 5.6.1-when-on-every-step-type
# Spec section 5.6.1: when is allowed on agent, command, approval, input and workflow steps.
# Expected: valid
apiVersion: awp.agenticworkflowprotocol.org/v1alpha4
kind: Workflow
metadata:
  name: conformance-base
spec:
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
        - name: level
    - id: apply
      agent: worker
      dependsOn:
        - analyze
      when: steps.analyze.outputs.level == "high"
      task: Apply ${{ steps.analyze.outputs.report }}.
    - id: count
      type: command
      dependsOn:
        - analyze
      when: steps.analyze.outputs.level != "low"
      command: ./count.sh
    - id: release
      type: approval
      dependsOn:
        - apply
      when: execution.environment == "production"
      approval:
        approvers:
          - role: release-manager
    - id: ask
      type: input
      dependsOn:
        - analyze
      when: '!(steps.analyze.outputs.level == "low")'
      input:
        message: Apply the fix?
        answerers:
          - role: release-manager
        timeout: 4h
    - id: fix
      type: workflow
      dependsOn:
        - analyze
      when: steps.analyze.outputs.level == "critical"
      workflow:
        ref: cve-fixer
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
