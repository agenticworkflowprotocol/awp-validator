# Release on every push to main that carries a new version.
#
# When package.json on main has a version that is not on npm yet, this workflow tests the package,
# tags the commit (v<version>), creates the GitHub release with the artefacts and publishes to npm
# with provenance. Pushes that do not change the version (docs, site, refactoring) only run the
# check and stop. To release: bump "version" in package.json, add the CHANGELOG entry, push to main.
#
# npm authentication: trusted publishing (OIDC). The trusted publisher on npmjs.com is configured
# for this repository and the workflow file publish.yml; do not rename this file. NPM_TOKEN is used
# only if it is set, as a fallback.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Is this version already published?
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node.js 22 ships npm 10.
      - run: npm install -g npm@11.21.3
      - run: npm ci --ignore-scripts
      - name: CHANGELOG has an entry for this version
        # Block scalar: in a plain YAML scalar " #" would start a comment and cut the command.
        run: |
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section ## [$VERSION]"; exit 1; }
      - run: npm test
      - name: Pack and collect artefacts
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          cp dist/browser/awp-validator.mjs release/
          cp vendor/awp/schema/awp.v1alpha*.json release/
          cd release && sha256sum * > SHA256SUMS
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; uploading artefacts again"
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
