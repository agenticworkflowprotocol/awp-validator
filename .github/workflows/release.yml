# On a tag v*: test, pack and attach the artefacts to a GitHub release, then start the publish
# workflow (npm registry). Publishing is a separate workflow so that a failed npm step can be
# re-run without touching the release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Pack and collect artefacts
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          cp dist/browser/awp-validator.mjs release/
          cp vendor/awp-v1alpha1/schema/awp.v1alpha1.json release/
          cd release && sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
      - name: Start npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
